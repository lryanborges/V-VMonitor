spring:
  application:
    name: vvmonitor-backend
  # perfil usado quando nenhum e informado (SPRING_PROFILES_ACTIVE); em producao, defina outro
  profiles:
    default: dev
  # autenticacao e feita por JWT contra a tabela users; dispensa o usuario em memoria padrao do Spring Security
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vvmonitor}
    username: ${DB_USERNAME:vvmonitor}
    password: ${DB_PASSWORD:vvmonitor}

  jpa:
    # Schema e responsabilidade do Flyway; o Hibernate apenas valida o mapeamento
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # obrigatorio fora do perfil dev; minimo de 32 bytes (HMAC-SHA256)
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:2h}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
