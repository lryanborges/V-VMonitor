spring:
  application:
    name: vvmonitor-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vvmonitor}
    username: ${DB_USERNAME:vvmonitor}
    password: ${DB_PASSWORD:vvmonitor}

  jpa:
    # Schema e responsabilidade do Flyway; o Hibernate apenas valida o mapeamento
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
